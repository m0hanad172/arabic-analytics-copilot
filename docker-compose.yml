services:
  db:
    image: postgres:16
    container_name: aac-pg
    restart: unless-stopped
    environment:
      # Used only on FIRST initialization of a NEW volume.
      # If the volume already contains data, these values will be ignored.
      POSTGRES_DB: arabic_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - aac_pgdata:/var/lib/postgresql/data

volumes:
  aac_pgdata:
    # Important: fixed name to avoid compose prefix volumes
    name: aac_pgdata