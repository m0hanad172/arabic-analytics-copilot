services:
  db:
    image: postgres:16
    container_name: aac-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: arabic_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGCLIENTENCODING: UTF8
    ports:
      - "5432:5432"
    volumes:
      - aac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arabic_analytics"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  aac_pgdata: